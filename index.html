<script>
// Search engine core. Same logic as the Colab notebook (tokenizer, TF-IDF, BM25, RRF, metrics).
const STOP = new Set("a an and are as at be by for from in is it of on or that the this to with your you my i can up two one".split(" "));

function stem(w) {
  if (w.endsWith("ies") && w.length > 4) w = w.slice(0, -3) + "y";
  else if (w.endsWith("ing") && w.length > 5) w = w.slice(0, -3);
  else if (w.endsWith("s") && !w.endsWith("ss") && w.length > 3) w = w.slice(0, -1);
  if (w.endsWith("e") && w.length > 4) w = w.slice(0, -1);
  return w;
}

// Returns [{raw, tok, dropped}] so the UI can show what happened to every word.
function analyze(text, o) {
  const words = text.toLowerCase().match(/[a-zà-ÿ0-9]+/g) || [];
  return words.map(raw => {
    if (o.stop && STOP.has(raw)) return { raw, tok: null, dropped: true };
    return { raw, tok: o.stem ? stem(raw) : raw, dropped: false };
  });
}
function tokenize(text, o) {
  return analyze(text, o).filter(x => !x.dropped).map(x => x.tok);
}

function buildEngine(docs, o) {
  const texts = docs.map(d => d.title + ". " + d.text);
  const toks = texts.map(t => tokenize(t, o));
  const N = docs.length;
  const df = new Map(), postings = new Map();
  toks.forEach((t, i) => {
    const c = new Map();
    t.forEach(w => c.set(w, (c.get(w) || 0) + 1));
    c.forEach((tf, w) => {
      df.set(w, (df.get(w) || 0) + 1);
      if (!postings.has(w)) postings.set(w, []);
      postings.get(w).push([i, tf]);
    });
  });
  const avgdl = toks.reduce((s, t) => s + t.length, 0) / N;
  return { docs, o, texts, toks, N, df, postings, avgdl };
}

const counts = arr => { const c = new Map(); arr.forEach(w => c.set(w, (c.get(w) || 0) + 1)); return c; };
const idfTfidf = (E, w) => Math.log((1 + E.N) / (1 + (E.df.get(w) || 0))) + 1;
const idfBm25 = (E, w) => { const n = E.df.get(w) || 0; return Math.log(1 + (E.N - n + 0.5) / (n + 0.5)); };

// TF-IDF with l2 normalisation and cosine, like scikit-learn's default.
function tfidfVec(E, tokens) {
  const c = counts(tokens.filter(w => E.df.has(w)));
  const v = new Map(); let s = 0;
  c.forEach((n, w) => { const x = n * idfTfidf(E, w); v.set(w, x); s += x * x; });
  const norm = Math.sqrt(s) || 1;
  v.forEach((x, w) => v.set(w, x / norm));
  return v;
}
// Per-document, per-term contribution to the score (for the breakdown chart).
function tfidfParts(E, q) {
  const qv = tfidfVec(E, tokenize(q, E.o));
  return E.toks.map(t => {
    const dv = tfidfVec(E, t), parts = [];
    qv.forEach((qw, w) => { if (dv.has(w)) parts.push({ w, s: qw * dv.get(w), tf: t.filter(x => x === w).length }); });
    return parts;
  });
}
function tfidfScores(E, q) { return tfidfParts(E, q).map(p => p.reduce((s, x) => s + x.s, 0)); }

function bm25Parts(E, q, k1, b) {
  const qt = [...new Set(tokenize(q, E.o))];
  return E.toks.map(t => {
    const c = counts(t), parts = [];
    qt.forEach(w => {
      if (!c.has(w)) return;
      const f = c.get(w);
      parts.push({ w, tf: f, s: idfBm25(E, w) * f * (k1 + 1) / (f + k1 * (1 - b + b * t.length / E.avgdl)) });
    });
    return parts;
  });
}
function bm25Scores(E, q, k1, b) { return bm25Parts(E, q, k1, b).map(p => p.reduce((s, x) => s + x.s, 0)); }

const order = sc => sc.map((_, i) => i).sort((a, b) => (sc[b] - sc[a]) || (a - b));
function rrf(lists, k = 60) {
  const out = new Array(lists[0].length).fill(0);
  lists.forEach(sc => order(sc).forEach((i, r) => { out[i] += 1 / (k + r + 1); }));
  return out;
}
function metrics(E, scores, rel) {
  const ids = order(scores).map(i => E.docs[i].id), hits = ids.map(d => rel.includes(d));
  const p3 = hits.slice(0, 3).filter(Boolean).length / 3;
  const r5 = hits.slice(0, 5).filter(Boolean).length / rel.length;
  let ap = 0, seen = 0;
  hits.forEach((h, i) => { if (h) { seen++; ap += seen / (i + 1); } });
  ap /= rel.length;
  const dcg = hits.slice(0, 10).reduce((s, h, i) => s + (h ? 1 : 0) / Math.log2(i + 2), 0);
  const idcg = Array.from({ length: Math.min(rel.length, 10) }, (_, i) => 1 / Math.log2(i + 2)).reduce((a, b) => a + b, 0);
  return { P3: p3, R5: r5, AP: ap, nDCG10: dcg / idcg };
}

if (typeof module !== "undefined") module.exports = { STOP, stem, analyze, tokenize, buildEngine, tfidfScores, tfidfParts, bm25Scores, bm25Parts, order, rrf, metrics, idfBm25, idfTfidf };

": "laptops", "price": 18}, {"id": "d23", "title": "Chromebook 11 inch for school", "text": "Light Chromebook for kids, browser and homework only.", "category": "laptops", "price": 90}, {"id": "d24", "title": "Laptop stand, aluminium", "text": "Ergonomic stand for your laptop, adjustable height.", "category": "laptops", "price": 15}, {"id": "d25", "title": "Programming books bundle", "text": "Six books on Python, JavaScript and algorithms, good condition.", "category": "laptops", "price": 40}, {"id": "d26", "title": "Dell XPS 13, i7, 16 GB", "text": "Ultrabook for computer science students, compiles code quickly.", "category": "laptops", "price": 540}, {"id": "d27", "title": "Bugaboo Fox pushchair, from newborn", "text": "Comfortable pushchair with a lie-flat seat, rain cover and large basket.", "category": "baby & kids", "price": 350}, {"id": "d28", "title": "Foldable buggy, lightweight", "text": "Maclaren buggy, folds with one hand and fits in a plane cabin. Perfect for holidays.", "category": "baby & kids", "price": 60}, {"id": "d29", "title": "Pram with carrycot, vintage style", "text": "Classic pram for a newborn baby, carrycot and mattress included.", "category": "baby & kids", "price": 120}, {"id": "d30", "title": "Double stroller for twins", "text": "Side-by-side double stroller, sturdy and smooth. A baby stroller for two.", "category": "baby & kids", "price": 180}, {"id": "d31", "title": "Baby car seat Maxi-Cosi", "text": "Group 0+ car seat, safe up to 13 kg, used for one child only.", "category": "baby & kids", "price": 50}, {"id": "d32", "title": "Baby monitor with camera", "text": "Video baby monitor with night vision and two-way audio.", "category": "baby & kids", "price": 35}, {"id": "d33", "title": "Stroller rain cover, universal", "text": "Clear rain cover that fits most strollers. Keeps your stroller dry.", "category": "baby & kids", "price": 10}, {"id": "d34", "title": "Wooden baby crib", "text": "Convertible crib with mattress, three height levels </script>
<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DOCS = DATA.docs, Q = DATA.queries, N = DOCS.length;
const byId = Object.fromEntries(DOCS.map((d, i) => [d.id, { ...d, i }]));
const cache = {}; const getE = o => cache[(+o.stop) + "" + (+o.stem)] || (cache[(+o.stop) + "" + (+o.stem)] = buildEngine(DOCS, o));
const E0 = getE({ stop: true, stem: true });
const WC = ["var(--w1)", "var(--w2)", "var(--w3)", "var(--w4)"];
const sum = a => a.reduce((s, x) => s + x, 0);
const rankAll = q => { const parts = tfidfParts(E0, q), sc = parts.map(p => sum(p.map(x => x.s))); return { parts, sc, ord: order(sc) }; };
const relOf = q => { const t = q.trim().toLowerCase(); for (const k in Q) if (Q[k].text === t) return Q[k].rel; return null; };
const fmtN = n => Math.round(n).toLocaleString("en-US");

const S = []; // sheets: {title, html, init}
const sheet = (title, html, init) => S.push({ title, html, init });
const head = (tag, title, lead) => `<div class="hd"><div class="sn">${tag}</div><div><h2>${title}</h2>${lead ? `<p class="lead">${lead}</p>` : ""}</div></div>`;

/* ---------- 1 cover ---------- */
sheet("Cover", `<div class="cover">
  <div class="tag">Text retrieval &middot; a search engine, step by step</div>
  <h1>How a search engine reads text</h1>
  <p class="lead" style="margin-top:1em">A customer types <span class="chip hi">cheap bike for commuting</span> into a marketplace with 36 listings. Which listing comes first, and why?</p>
  <div class="scroll" style="margin-top:1.6em"><svg viewBox="0 0 720 96" width="100%" style="min-width:560px;max-width:900px" role="img" aria-label="Pipeline: raw text, tokens, inverted index, TF-IDF weights, ranked results.">
    ${["Raw text", "1 Tokens", "2 Index", "3 TF-IDF", "Ranking"].map((t, i) => `<rect x="${4 + i * 144}" y="20" width="120" height="44" class="ink" stroke-width="1.6" ${i > 0 && i < 4 ? 'style="fill:var(--ink)"' : ""}/><text x="${64 + i * 144}" y="47" text-anchor="middle" style="font-size:13px;fill:${i > 0 && i < 4 ? "var(--paper)" : "var(--ink)"}">${t}</text>${i < 4 ? `<path d="M${126 + i * 144} 42h16m-5-4 5 4-5 4" class="ink" stroke-width="1.6"/>` : ""}`).join("")}
    <path d="M148 84h420" class="ink" stroke-width="1.2"/><path d="M148 78v12M568 78v12" class="ink" stroke-width="1.2"/><text x="358" y="76" text-anchor="middle" style="fill:var(--signal);font-size:12px">THE THREE STEPS ON THESE SHEETS</text></svg></div></div>`);

/* ---------- 2 text mining chain ---------- */
const CHAIN = [
 ["Business question", "Someone has a decision to make. The question fixes what counts as a useful result.", "Which complaints make guests leave a low score, and which hotels should fix them first?", "A question and a definition of success"],
 ["Collect the text", "Export from a database, files, an API or a web page.", "Reviews arrive from the booking site as a CSV file.", "A table with a text column"],
 ["Clean and prepare", "Remove duplicates and empty rows, pick the language, split into tokens.", "Drop reviews under 5 words. Keep English and Spanish apart.", "Tokens: one list per document"],
 ["Analyse", "Search, keywords, topics, classification, sentiment.", "Find topics in negative reviews: noise, cleanliness, staff.", "Ranked lists, themes or labels"],
 ["Check with people", "Read a sample, compare with human labels, measure the errors.", "Two people label 100 reviews. The model agrees on 8 out of 10.", "An error rate"],
 ["Use and monitor", "Put the results in a dashboard or an app. Watch the quality over time.", "A weekly dashboard for hotel managers.", "A running system"]];
sheet("What is text mining", head("OVERVIEW", "Text mining is a chain of steps", "Text mining turns text (emails, reviews, tickets, contracts) into something that can be counted, compared and decided on. Click each step.") +
  `<div class="flow" id="chain">${CHAIN.map((c, i) => `<button class="step" data-i="${i}"><b>${i + 1}</b>${c[0]}</button>`).join("")}</div>
  <div class="box" id="chain-d" style="margin-top:1.2em"></div>`,
  root => { const show = i => { $$(".step", root).forEach((b, j) => b.classList.toggle("on", j === i)); const c = CHAIN[i]; $("#chain-d", root).innerHTML = `<div class="two"><div><span class="tag">What happens</span><p style="margin:.2em 0 .8em">${c[1]}</p><span class="tag">What comes out</span><p style="margin:.2em 0">${c[3]}</p></div><div><span class="tag">Example: hotel chain, 200,000 reviews</span><p style="margin:.2em 0;font-size:1.1em">${c[2]}</p></div></div>`; };
    $("#chain", root).onclick = e => { const b = e.target.closest(".step"); if (b) show(+b.dataset.i); }; show(0); });

/* ---------- 3 uses ---------- */
const USES = [
 ["Search and retrieval", "Find a product, a ticket or a policy from a few words.", "A ranked list of documents", "Marketplace: “cheap bike for commuting”. Support: “invoice charged twice”."],
 ["Keywords and topics", "What are customers talking about in 50,000 reviews?", "Main themes and how big each one is", "Airline: baggage, delays and food are the three big themes this month."],
 ["Classification and sentiment", "Send each support ticket to the right team. Measure brand mood.", "One label per text", "“I was charged twice” → Billing team, negative."],
 ["Extraction", "Pull names, dates and amounts out of contracts and invoices.", "A table built from text", "Contract → start date, notice period, amount."],
 ["Question answering", "An internal assistant that answers from company documents.", "A written answer", "It first searches for the right pages, then writes the answer from them."]];
sheet("Where it is used", head("OVERVIEW", "What text mining is used for", "Five families of tasks.") +
  `<div class="two wide"><div class="row" id="uses" style="flex-direction:column;align-items:stretch">${USES.map((u, i) => `<button class="tab" data-i="${i}" style="text-align:left">${u[0]}</button>`).join("")}</div><div class="box" id="uses-d"></div></div>`,
  root => { const show = i => { $$(".tab", root).forEach((b, j) => b.classList.toggle("on", j === i)); const u = USES[i]; $("#uses-d", root).innerHTML = `<span class="tag">Business question</span><p style="margin:.2em 0 .7em">${u[1]}</p><span class="tag">Typical result</span><p style="margin:.2em 0 .7em">${u[2]}</p><span class="tag">Example</span><p style="margin:.2em 0">${u[3]}</p>`; };
    $("#uses", root).onclick = e => { const b = e.target.closest(".tab"); if (b) show(+b.dataset.i); }; show(0); });

/* ---------- 4 tools ---------- */
const TOOLS = [
 ["Prepare and explore text", "Python: pandas, NLTK, spaCy. SQL for the source data.", "Load tables, split text into tokens, count words."],
 ["Search over many documents", "Elasticsearch, OpenSearch, Solr. Full-text search in PostgreSQL.", "Keep an inverted index and rank results, often with BM25."],
 ["Weights, topics, classifiers", "scikit-learn, gensim, BERTopic.", "TF-IDF vectors, topic models, text classifiers."],
 ["Meaning-based search", "Hugging Face models, sentence embeddings, vector databases (FAISS, pgvector), language-model APIs.", "Match by meaning instead of exact words."],
 ["Ready-made cloud services", "Amazon Comprehend, Azure AI Language, Google Cloud Natural Language.", "Sentiment, entities and topics through an API."],
 ["Analytics platforms", "SAS and similar.", "Analysis in one managed environment."]];
sheet("Tools", head("OVERVIEW", "Tools used in practice", "The search engines on this list work on the ideas shown in the sheets that follow.") +
  `<div class="scroll"><table id="tl"><tr><th>Need</th><th>Tools</th><th>What they do</th></tr>${TOOLS.map(t => `<tr><td><b>${t[0]}</b></td><td>${t[1]}</td><td>${t[2]}</td></tr>`).join("")}</table></div>`);

/* ---------- 6 hook ---------- */
sheet("Why search is hard", head("PROBLEM", "A simple text match: what does the customer get?", "The left column returns every listing that contains exactly the typed text. The right column ranks all listings by a score.") +
  `<div class="row"><input type="text" id="hk-q" value="cheap bike for commuting" aria-label="Query">${Object.values(Q).map(q => `<button class="chipbtn" data-q="${esc(q.text)}">${esc(q.text)}</button>`).join("")}</div>
  <div class="two" style="margin-top:1em"><div class="box"><span class="tag">Exact-text match</span><div id="hk-l"></div></div>
  <div class="box"><span class="tag">Ranked search</span><div id="hk-r"><button class="btn" id="hk-show">Show ranked result</button></div></div></div>`,
  root => { let shown = false; const q = () => $("#hk-q", root).value;
    const draw = () => { const t = q().trim().toLowerCase(); const hits = t ? DOCS.filter(d => (d.title + ". " + d.text).toLowerCase().includes(t)) : [];
      $("#hk-l", root).innerHTML = `<p class="big" style="margin:.1em 0">${hits.length}</p><p style="margin:.1em 0 .5em">${hits.length === 0 ? "listings contain exactly this text." : hits.length === 1 ? "listing contains this text." : "listings contain this text, all with the same rank."}</p><ul style="margin:0;padding-left:1.1em;font-size:.92em">${hits.slice(0, 8).map(d => `<li>${esc(d.title)}</li>`).join("")}${hits.length > 8 ? `<li>&hellip; and ${hits.length - 8} more</li>` : ""}</ul>`;
      if (shown) { const r = rankAll(q()); $("#hk-r", root).innerHTML = `<p class="mono" style="margin:0 0 .4em">Every listing gets a score, best first</p>` + r.ord.slice(0, 6).map((i, k) => `<div class="brow" style="grid-template-columns:2em minmax(0,1fr) 3.6em;margin:.25em 0"><span class="mono">#${k + 1}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(DOCS[i].title)}</span><span class="val">${r.sc[i].toFixed(3)}</span></div>`).join("") + ``; } };
    $("#hk-q", root).oninput = draw; root.addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (b) { $("#hk-q", root).value = b.dataset.q; draw(); } if (e.target.id === "hk-show") { shown = true; draw(); } }); draw(); });

/* ---------- 7 tokens ---------- */
sheet("Tokens", head("STEP 1 OF 3", "Tokens: cut text into pieces a computer can compare", "Text is split into words, common words are dropped, and words are cut to a root. Switch the two cleaning steps on and off.") +
  `<div class="row"><input type="text" id="tk-s" value="Cheap bikes for commuting to the office" aria-label="Sentence"><select id="tk-l" aria-label="Load a listing"><option value="">Load a listing&hellip;</option>${DOCS.map(d => `<option value="${d.id}">${d.id} ${esc(d.title)}</option>`).join("")}</select></div>
  <div class="row" style="margin:.6em 0 .9em"><label class="ck"><input type="checkbox" id="tk-stop" checked> Remove stopwords</label><label class="ck"><input type="checkbox" id="tk-stem" checked> Stemming</label></div>
  <div class="scroll box" id="tk-out"></div>
  <p class="mono" id="tk-sum" style="margin:.7em 0 0"></p>
  <div class="two" style="margin-top:1em"><div class="box"><span class="tag">Our tiny stemmer vs a professional one</span><div class="scroll"><table><tr><th>Word</th><th>Ours</th><th>Snowball</th></tr>${[["commuting", "commut", "commut"], ["bicycles", "bicycl", "bicycl"], ["couches", "couch", "couch"], ["programming", "programm", "program"], ["pushchair", "pushchair", "pushchair"]].map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td${r[1] !== r[2] ? ' style="color:var(--signal)"' : ""}>${r[2]}</td></tr>`).join("")}</table></div></div>
  <div class="box"><span class="tag">How stemming works</span><p style="margin:.2em 0">A stem is not always a real word. It only has to be the same for every form of the word, so <i>bike</i> and <i>bikes</i> end up in the same index entry. The simple stemmer here cuts endings by rules; a professional one uses more rules and makes fewer mistakes.</p></div></div>`,
  root => { const draw = () => { const text = $("#tk-s", root).value, so = $("#tk-stop", root).checked, sm = $("#tk-stem", root).checked;
      const words = (text.toLowerCase().match(/[a-zà-ÿ0-9]+/g) || []).slice(0, 40); const kept = [];
      const r1 = words.map(w => `<span class="chip">${esc(w)}</span>`);
      const r2 = words.map(w => so && STOP.has(w) ? `<span class="chip drop">${esc(w)}</span>` : `<span class="chip">${esc(w)}</span>`);
      const r3 = words.map(w => { if (so && STOP.has(w)) return `<span class="chip void">&nbsp;</span>`; const t = sm ? stem(w) : w; kept.push(t); return `<span class="chip${t !== w ? " chg" : ""}">${esc(t)}</span>`; });
      const row = (l, c) => `<div class="tokrow" style="min-width:max-content"><span class="tag">${l}</span>${c.join("")}</div>`;
      $("#tk-out", root).innerHTML = row("1 split", r1) + row("2 stopwords", r2) + row("3 stem", r3);
      $("#tk-sum", root).textContent = `${words.length} words in → ${kept.length} tokens out: ${kept.join(" · ") || "(none)"}`; };
    root.addEventListener("input", e => { if (e.target.id === "tk-l" && e.target.value) $("#tk-s", root).value = byId[e.target.value].title + ". " + byId[e.target.value].text; draw(); }); draw(); });

/* ---------- 8 vocabulary ---------- */
sheet("Vocabulary", head("STEP 1 OF 3", "What cleaning does to the whole catalogue", "Computed live from the 36 listings. The most frequent tokens are the catalogue&rsquo;s own words, so they do not separate one listing from another. Click a bar to see which listings contain the token.") +
  `<div class="two"><div class="box"><span class="tag">Distinct words (vocabulary)</span><div class="bars" id="vc-f"></div><p id="vc-once" style="margin:.8em 0 0"></p></div>
  <div class="box"><span class="tag">Most frequent tokens</span><div class="bars" id="vc-t"></div><p id="vc-d" class="mono" style="margin:.6em 0 0;text-transform:none">&nbsp;</p></div></div>
  `,
  root => { const cfg = [["raw words", { stop: false, stem: false }], ["no stopwords", { stop: true, stem: false }], ["stemmed", { stop: true, stem: true }]];
    const info = cfg.map(([l, o]) => { const e = getE(o); return [l, e.df.size, sum(e.toks.map(t => t.length))]; });
    $("#vc-f", root).innerHTML = info.map(x => `<div class="brow"><span class="lab">${x[0]}</span><div class="track"><div class="fill" style="width:${x[1] / info[0][1] * 100}%"></div></div><span class="val">${x[1]}</span></div>`).join("") + `<p class="mono" style="margin:.5em 0 0;text-transform:none">word occurrences: ${info.map(x => x[2]).join(" → ")}</p>`;
    const tot = new Map(); E0.toks.forEach(t => t.forEach(w => tot.set(w, (tot.get(w) || 0) + 1)));
    const once = [...tot.values()].filter(v => v === 1).length, df1 = [...E0.df.values()].filter(v => v === 1).length;
    $("#vc-once", root).innerHTML = `<b>${once}</b> of ${tot.size} tokens appear only once in the whole catalogue. <b>${df1}</b> appear in a single listing.`;
    const top = [...tot.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, 12), mx = top[0][1];
    $("#vc-t", root).innerHTML = top.map(([w, c]) => `<div class="brow" data-w="${w}" style="cursor:pointer"><span class="lab">${w}</span><div class="track"><div class="fill" style="width:${c / mx * 100}%"></div></div><span class="val">${c}</span></div>`).join("");
    $("#vc-t", root).onclick = e => { const r = e.target.closest("[data-w]"); if (!r) return; const w = r.dataset.w, ids = E0.postings.get(w).map(p => DOCS[p[0]].id); $("#vc-d", root).textContent = `"${w}" appears in ${ids.length} listings: ${ids.join(", ")}`; }; });

/* ---------- 9 index ---------- */
sheet("Inverted index", head("STEP 2 OF 3", "The inverted index: word → list of documents", "Like the index at the back of a book: for each token, the listings that contain it. Numbers in brackets show how many times the word appears in that listing.") +
  `<div class="row"><input type="text" id="ix-q" value="cheap bike for commuting" aria-label="Query">${Object.values(Q).map(q => `<button class="chipbtn" data-q="${esc(q.text)}">${esc(q.text)}</button>`).join("")}</div><div class="row" style="margin-top:.5em"><label class="ck"><input type="radio" name="ix-m" value="and" checked> AND: every word must match</label><label class="ck"><input type="radio" name="ix-m" value="or"> OR: any word</label></div>
  <div class="two wide" style="margin-top:1em"><div class="box"><span class="tag">Postings lists</span><div id="ix-p" style="display:grid;gap:.6em"></div>
   <div id="ix-r" style="margin-top:.5em"></div></div>
  <div class="box"><span class="tag">Why engines use an index</span><p style="margin:.2em 0 .6em">Catalogue size: <b id="ix-n"></b> documents</p><input type="range" id="ix-s" min="1.5" max="8" step="0.1" value="6" aria-label="Catalogue size"><div class="bars" id="ix-b" style="margin-top:.8em"></div><p id="ix-t" style="margin:.7em 0 0;font-size:.92em"></p></div></div>`,
  root => { const draw = () => { const q = $("#ix-q", root).value, toks = [...new Set(tokenize(q, E0.o))], mode = $("input[name=ix-m]:checked", root).value;
      $("#ix-p", root).innerHTML = toks.length ? toks.map(w => { const p = E0.postings.get(w) || []; const mx = Math.max(0, ...p.map(x => x[1])); return `<div><span class="chip on">${esc(w)}</span> <span class="mono">df ${p.length}</span><div class="postings" style="margin-top:.3em">${p.length ? p.map(([i, tf]) => `<span class="pc">${DOCS[i].id} <b>(${tf})</b></span>`).join("") : '<span class="mono">not in the index</span>'}</div></div>`; }).join("") : `<span class="mono">Type a query</span>`;
      const sets = toks.map(w => new Set((E0.postings.get(w) || []).map(p => p[0]))); let res = [];
      if (sets.length) res = mode === "and" ? [...sets.reduce((a, b) => new Set([...a].filter(x => b.has(x))))] : [...new Set(sets.flatMap(s => [...s]))];
      res.sort((a, b) => a - b);
      $("#ix-r", root).innerHTML = `<p style="margin:.2em 0"><b>${res.length}</b> listing${res.length === 1 ? "" : "s"} &middot; in no useful order</p><ul style="margin:0;padding-left:1.1em;font-size:.9em">${res.slice(0, 6).map(i => `<li>${DOCS[i].id} ${esc(DOCS[i].title)}</li>`).join("")}${res.length > 6 ? `<li>&hellip;</li>` : ""}</ul>`;
      const size = Math.round(10 ** +$("#ix-s", root).value); $("#ix-n", root).textContent = fmtN(size);
      const dfs = toks.map(w => (E0.postings.get(w) || []).length).filter(x => x > 0), m = dfs.length ? Math.min(...dfs) : 0, reads = Math.max(1, Math.round(m / N * size)), lg = x => Math.log10(Math.max(1, x)) / 8.2 * 100;
      $("#ix-b", root).innerHTML = `<div class="brow" style="grid-template-columns:5.5em minmax(0,1fr) 6.5em"><span class="lab">scan all</span><div class="track"><div class="fill" style="width:${lg(size)}%"></div></div><span class="val">${fmtN(size)}</span></div><div class="brow" style="grid-template-columns:5.5em minmax(0,1fr) 6.5em"><span class="lab">use index</span><div class="track"><div class="fill" style="width:${lg(reads)}%;background:var(--signal)"></div></div><span class="val">${fmtN(reads)}</span></div><p class="mono" style="margin:0;text-transform:none">documents checked (log scale)</p>`;
      $("#ix-t", root).textContent = m ? `The engine starts from the shortest list (${m} of ${N} listings, ${(m / N * 100).toFixed(0)}%). The rarer the word, the bigger the saving.` : "None of the words is in the index."; };
    root.addEventListener("input", draw); root.addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (b) { $("#ix-q", root).value = b.dataset.q; draw(); } }); draw(); });

/* ---------- 10 IDF ---------- */
sheet("TF and IDF", head("STEP 3 OF 3", "TF-IDF: how much is a word worth?", "TF: how often the word appears in this listing. IDF: how rare the word is in the catalogue. Weight = TF × IDF.") +
  `<div class="two"><div class="box"><span class="tag">IDF of one word</span><div class="row"><input type="text" id="id-w" value="bike" aria-label="Word" style="width:10em">${["cheap", "commuting", "bike", "sofa", "the"].map(w => `<button class="chipbtn" data-w="${w}">${w}</button>`).join("")}</div>
   <p id="id-t" style="margin:.7em 0 .3em"></p><div class="scroll"><svg id="id-svg" viewBox="0 0 380 210" width="100%" style="min-width:300px" role="img" aria-label="IDF falls as more listings contain the word"></svg></div><p class="mono" style="margin:0;text-transform:none" id="id-h"></p></div>
  <div class="box"><span class="tag">One listing, by hand</span><div class="row"><select id="id-d" aria-label="Listing">${DOCS.map(d => `<option value="${d.id}"${d.id === "d02" ? " selected" : ""}>${d.id} ${esc(d.title)}</option>`).join("")}</select><select id="id-q" aria-label="Query">${Object.values(Q).map(q => `<option>${esc(q.text)}</option>`).join("")}</select></div>
   <div class="scroll" style="margin-top:.7em"><table id="id-tab"></table></div><p class="note" id="id-n"></p></div></div>`,
  root => { const idf = w => idfTfidf(E0, w); const draw = () => { const raw = $("#id-w", root).value.trim().toLowerCase(), w = raw.match(/[a-zà-ÿ0-9]+/) ? raw.match(/[a-zà-ÿ0-9]+/)[0] : "";
      const t = w ? (STOP.has(w) ? null : stem(w)) : ""; const df = t ? (E0.df.get(t) || 0) : 0;
      $("#id-t", root).innerHTML = !w ? "Type a word." : t === null ? `<b>${esc(w)}</b> is a stopword. It is removed before this step.` : df === 0 ? `<b>${esc(t)}</b> is in no listing, so it cannot match anything.` : `<b>${esc(t)}</b> is in <b>${df}</b> of ${N} listings. IDF = ln((1 + ${N}) / (1 + ${df})) + 1 = <b>${idf(t).toFixed(2)}</b>`;
      const X = d => 40 + (d - 1) / (N - 1) * 320, Y = v => 180 - (v - 1) / 3.7 * 160; let path = ""; for (let d = 1; d <= N; d++) path += (d === 1 ? "M" : "L") + X(d).toFixed(1) + " " + Y(Math.log((1 + N) / (1 + d)) + 1).toFixed(1);
      const hist = {}; E0.df.forEach(v => hist[v] = (hist[v] || 0) + 1);
      $("#id-svg", root).innerHTML = `<path d="M40 180H360M40 20V180" class="ink" stroke-width="1.2"/>${[1, 2, 3, 4].map(v => `<path d="M40 ${Y(v)}h-4" class="ink"/><text x="32" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join("")}${[1, 10, 20, 30, 36].map(d => `<path d="M${X(d)} 180v4" class="ink"/><text x="${X(d)}" y="196" text-anchor="middle">${d}</text>`).join("")}<path d="${path}" class="ink" stroke-width="2.2" style="stroke:var(--ink)"/>${t && df ? `<circle cx="${X(df)}" cy="${Y(idf(t))}" r="6" style="fill:var(--signal);stroke:var(--paper);stroke-width:2"/><path d="M${X(df)} ${Y(idf(t))}V180M40 ${Y(idf(t))}H${X(df)}" style="stroke:var(--signal);stroke-dasharray:3 3;fill:none"/>` : ""}<text x="200" y="208" text-anchor="middle">listings that contain the word (df)</text><text x="6" y="14">IDF</text>`;
      $("#id-h", root).textContent = `Catalogue: ${hist[1]} tokens are in one listing only; ${hist[2] || 0} in two; ${hist[3] || 0} in three.`;
      const d = byId[$("#id-d", root).value], qt = [...new Set(tokenize($("#id-q", root).value, E0.o))], toks = E0.toks[d.i], c = {}; toks.forEach(x => c[x] = (c[x] || 0) + 1);
      const rows = qt.map(x => [x, c[x] || 0, idf(x), (c[x] || 0) * idf(x)]);
      $("#id-tab", root).innerHTML = `<tr><th>Query token</th><th>TF</th><th>IDF</th><th>TF × IDF</th></tr>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2].toFixed(2)}</td><td>${r[3].toFixed(2)}</td></tr>`).join("")}`;
      $("#id-n", root).textContent = rows.every(r => r[1] === 0) ? "This listing contains none of the query words. Its score is 0." : `Rare words that the listing contains add the most. Each listing&rsquo;s weights are then scaled to length 1, so long texts do not win only by length.`; };
    root.addEventListener("input", draw); root.addEventListener("click", e => { const b = e.target.closest("[data-w]"); if (b) { $("#id-w", root).value = b.dataset.w; draw(); } }); draw(); });

/* ---------- 11 ranking ---------- */
sheet("Ranking", head("STEP 3 OF 3", "TF-IDF ranking: where does each score come from?", "Each bar is split by query word. Click a row to read the listing.") +
  `<div class="row"><input type="text" id="rk-q" value="cheap bike for commuting" aria-label="Query">${Object.values(Q).map(q => `<button class="chipbtn" data-q="${esc(q.text)}">${esc(q.text)}</button>`).join("")}</div>
  <div class="row" style="margin:.5em 0"><label class="ck"><input type="checkbox" id="rk-rel" checked> Mark listings a person judged relevant</label><span id="rk-leg" class="row"></span></div>
  <div class="two wide"><div class="box" style="padding:.3em .6em" id="rk-l"></div><div><div class="box" id="rk-d"></div><p class="note" id="rk-n"></p></div></div>`,
  root => { let sel = 0; const draw = () => { const q = $("#rk-q", root).value, r = rankAll(q), toks = [...new Set(tokenize(q, E0.o))], rel = $("#rk-rel", root).checked ? relOf(q) : null, top = r.ord.slice(0, 8), mx = r.sc[top[0]] || 1;
      $("#rk-leg", root).innerHTML = toks.map((w, i) => `<span class="mono" style="display:inline-flex;align-items:center;gap:.35em"><i style="display:inline-block;width:.9em;height:.9em;background:${WC[i % 4]}"></i>${esc(w)}</span>`).join("");
      $("#rk-l", root).innerHTML = top.map((i, k) => { const p = r.parts[i]; return `<div class="rk${k === sel ? " sel" : ""}" data-k="${k}"><span class="mono">#${k + 1}</span><span class="mono">${DOCS[i].id}</span><span class="t">${esc(DOCS[i].title)}</span><div class="stk" style="height:1em"><div class="stack" style="width:${r.sc[i] / mx * 100}%">${toks.map((w, j) => { const s = (p.find(x => x.w === w) || { s: 0 }).s; return s ? `<i style="width:${s / r.sc[i] * 100}%;background:${WC[j % 4]}" title="${esc(w)}"></i>` : ""; }).join("")}</div></div><span class="sc">${r.sc[i].toFixed(3)}</span><span>${rel && rel.includes(DOCS[i].id) ? '<span class="ok" title="judged relevant">✓</span>' : ""}</span></div>`; }).join("");
      const i = top[sel], p = r.parts[i].slice().sort((a, b) => b.s - a.s);
      $("#rk-d", root).innerHTML = r.sc[i] ? `<span class="tag">#${sel + 1} &middot; ${DOCS[i].id} &middot; ${DOCS[i].category} &middot; ${DOCS[i].price} EUR</span><p style="margin:.3em 0 .1em"><b>${esc(DOCS[i].title)}</b></p><p style="margin:0;font-size:.92em">${esc(DOCS[i].text)}</p>` : `<span class="mono">No listing contains these words.</span>`;
      let msg = ""; if (r.sc[top[0]] > 0) { const t = r.parts[top[0]].slice().sort((a, b) => b.s - a.s)[0], pct = Math.round(t.s / r.sc[top[0]] * 100); msg = `#1 is &ldquo;${esc(DOCS[top[0]].title)}&rdquo;. ${pct}% of its score comes from &ldquo;${esc(t.w)}&rdquo;, which appears ${t.tf} time${t.tf === 1 ? "" : "s"} in that listing.`; const R = relOf(q); if (R && !R.includes(DOCS[top[0]].id)) msg += ` It is not among the listings a person judged relevant.`; }
      $("#rk-n", root).innerHTML = msg; };
    root.addEventListener("input", () => { sel = 0; draw(); }); root.addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (b) { $("#rk-q", root).value = b.dataset.q; sel = 0; draw(); return; } const r = e.target.closest(".rk"); if (r) { sel = +r.dataset.k; draw(); } }); draw(); });

/* ---------- 12 four queries ---------- */
sheet("Four queries", head("RESULT", "Where the relevant listings end up", "Four test queries. For each one, a person marked four listings as relevant. Their rank in the TF-IDF ranking, and the query words they contain:") +
  `<div class="row" id="fq-b">${Object.entries(Q).map(([k, q], i) => `<button class="tab${i ? "" : " on"}" data-k="${k}">${esc(q.text)}</button>`).join("")}</div>
  <div class="box" style="margin-top:.9em"><div class="scroll"><table id="fq-t"></table></div><p id="fq-s" class="big" style="margin:.5em 0 0;font-size:1.7em"></p></div><p class="note" id="fq-n"></p>`,
  root => { const draw = k => { $$(".tab", root).forEach(b => b.classList.toggle("on", b.dataset.k === k)); const q = Q[k], r = rankAll(q.text), toks = [...new Set(tokenize(q.text, E0.o))], pos = new Map(r.ord.map((i, p) => [i, p + 1]));
      const rows = q.rel.map(id => { const i = byId[id].i, has = toks.filter(w => E0.df.has(w) && E0.toks[i].includes(w)); return { id, t: DOCS[i].title, p: pos.get(i), sc: r.sc[i], has }; });
      $("#fq-t", root).innerHTML = `<tr><th>Relevant listing</th><th>Rank of 36</th><th>Score</th><th>Query words it contains</th></tr>` + rows.map(x => `<tr><td>${x.id} ${esc(x.t)}</td><td>${x.sc ? "#" + x.p : "not returned"}</td><td>${x.sc.toFixed(3)}</td><td>${toks.map(w => `<span class="chip${x.has.includes(w) ? " on" : " drop"}">${esc(w)}</span>`).join(" ")}</td></tr>`).join("");
      const found = rows.filter(x => x.sc && x.p <= 4).length; $("#fq-s", root).textContent = `${found} of 4 in the top 4`;
      const none = rows.filter(x => x.has.length === 0).map(x => x.id);
      $("#fq-n", root).innerHTML = none.length ? `<b>${none.join(", ")}</b> ${none.length === 1 ? "shares" : "share"} no word with the query. ${none.length === 1 ? "It uses" : "They use"} other words (couch, pushchair, notebook, cycle). Keyword matching cannot know these mean the same. This is called the vocabulary mismatch problem.` : `Every relevant listing shares at least one word with the query, but words repeated in other listings can still push them down.`; };
    $("#fq-b", root).onclick = e => { const b = e.target.closest("[data-k]"); if (b) draw(b.dataset.k); }; draw("q1"); });

/* ---------- shell ---------- */
const stage = $("#stage"), ticks = $("#ticks"); let cur = -1; const seen = new Set();
S.forEach((s, i) => { const el = document.createElement("section"); el.className = "sheet"; el.setAttribute("aria-label", s.title); el.innerHTML = s.html; stage.appendChild(el); s.el = el; ticks.insertAdjacentHTML("beforeend", `<i data-i="${i}" title="${esc(s.title)}"></i>`); });
$("#idxl").innerHTML = S.map((s, i) => `<li><button data-i="${i}"><span class="mono">${String(i + 1).padStart(2, "0")}</span>${esc(s.title)}</button></li>`).join("");
$("#tbn").textContent = " 01/" + S.length;
function go(i) { i = Math.max(0, Math.min(S.length - 1, i)); if (i === cur) return; if (cur >= 0) S[cur].el.classList.remove("on"); cur = i; const s = S[i]; s.el.classList.add("on"); s.el.scrollTop = 0; if (!s.done && s.init) { s.done = 1; s.init(s.el); } seen.add(i);
  $("#tbn").textContent = " " + String(i + 1).padStart(2, "0") + "/" + S.length; $("#tbt").textContent = s.title; $$("#ticks i").forEach((t, j) => { t.classList.toggle("on", j === i); t.classList.toggle("seen", seen.has(j) && j !== i); }); $("#idx").hidden = true;
  try { history.replaceState(null, "", "#s" + (i + 1)); } catch (e) {} }
S.forEach((s, i) => { s.init = s.init || null; }); 
$("#prev").onclick = () => go(cur - 1); $("#next").onclick = () => go(cur + 1); $("#bidx").onclick = () => { $("#idx").hidden = !$("#idx").hidden; };
$("#bth").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
$("#ticks").onclick = e => { const t = e.target.closest("i"); if (t) go(+t.dataset.i); }; $("#idxl").onclick = e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); };
addEventListener("keydown", e => { const tg = e.target; if (tg.tagName === "SELECT" || tg.tagName === "TEXTAREA" || (tg.tagName === "INPUT" && tg.type !== "checkbox")) return; const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); go(cur + 1); } else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); go(cur - 1); } else if (k === "Home") go(0); else if (k === "End") go(S.length - 1);
  else if (k === "f" || k === "F") { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (x) {} } else if (k === "g" || k === "G") $("#bidx").click(); });
const h = parseInt((location.hash.match(/^#s(\d+)$/) || [])[1]); go(h > 0 && h <= S.length ? h - 1 : 0);
</script>
