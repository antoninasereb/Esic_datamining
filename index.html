 `<div class="row" id="c-t"><button class="tab on" data-k="raw">Raw counts</button><button class="tab" data-k="nostop">Without stop words</button><button class="tab" data-k="domain">+ film, movie, one removed</button></div>
  <div class="box" style="margin-top:.9em"><span class="tag" id="c-tag"></span><div id="c-b"></div></div><p class="note" id="c-n"></p>`,
 root => {
  const N = { raw: `The top is grammar: the, and, of. ${fmtN(D.counts.tokens)} words in total, ${fmtN(D.counts.types)} different words.`, nostop: "Grammar is gone. Now film and movie lead. They are not English stop words, but every film review has them.", domain: "Now like, just, good, time, story. These describe the collection, not one review. We still cannot say which review to read." };
  const T = { raw: "Raw counts", nostop: "Without stop words", domain: "Film, movie and one also removed" };
  let k = "raw"; const draw = () => { const r = D.counts[k].slice(0, 12); $("#c-tag", root).textContent = T[k] + " (top 12)"; $("#c-b", root).innerHTML = bars(r, r[0][1]); $("#c-n", root).textContent = N[k]; $$("#c-t .tab", root).forEach(b => b.classList.toggle("on", b.dataset.k === k)); };
  $("#c-t", root).onclick = e => { const b = e.target.closest("[data-k]"); if (b) { k = b.dataset.k; draw(); } }; draw(); });


const MINI = ["great film great story", "boring film boring story", "boring waste time", "great story"];
const MV = [...new Set(MINI.flatMap(t => t.split(" ")))].sort(), MTF = MINI.map(t => MV.map(w => t.split(" ").filter(x => x === w).length));
const MDF = MV.map((w, j) => MTF.filter(r => r[j] > 0).length), MIDF = MDF.map(d => Math.log((1 + MINI.length) / (1 + d)) + 1);
const MW = MTF.map(r => r.map((x, j) => x * MIDF[j]));

sheet("Four reviews", head("02", "Weigh four tiny reviews", "Click a word. How many times is it in each review (TF)? How rare is it (IDF)? What is the weight?") +
 `<div class="row" id="m-w"></div>
  <div class="box" id="m-b1" style="margin-top:.7em"><div class="scroll"><table id="m-t"></table></div></div>

  <div class="box" id="m-fb" style="margin-top:.5em" hidden><div class="scroll"><table id="m-f" style="font-size:.85em"></table></div></div><p class="note" id="m-n"></p>`,
 root => { let k = MV.indexOf("story");
  $("#m-w", root).innerHTML = MV.map((w, j) => `<button class="chipbtn" data-j="${j}">${w}</button>`).join("");
  const draw = () => { const w = MV[k];
   $("#m-t", root).innerHTML = `<tr><th></th><th>Review</th><th>TF</th><th>IDF</th><th>TF &times; IDF</th></tr>` + MINI.map((t, i) => `<tr><td>R${i + 1}</td><td>${t.split(" ").map(x => x === w ? `<b style="color:var(--signal)">${x}</b>` : x).join(" ")}</td><td>${MTF[i][k]}</td><td>${f2(MIDF[k])}</td><td><b>${f2(MW[i][k])}</b></td></tr>`).join("");
   const full = $("#m-a", root).checked; $("#m-fb", root).hidden = !full; $("#m-b1", root).hidden = full;
   if (full) $("#m-f", root).innerHTML = `<tr><th></th>${MV.map((x, j) => `<th${j === k ? ' style="color:var(--signal)"' : ""}>${x}</th>`).join("")}</tr>` + MW.map((r, i) => `<tr><td>R${i + 1}</td>${r.map((x, j) => `<td${j === k ? ' style="font-weight:700"' : ""}>${f2(x)}</td>`).join("")}</tr>`).join("");
   $("#m-n", root).textContent = `"${w}" is in ${MDF[k]} of 4 reviews, so its IDF is ${f2(MIDF[k])}. The fewer reviews, the bigger the number.`;
   $$("#m-w .chipbtn", root).forEach(b => b.classList.toggle("on", +b.dataset.j === k)); };
  $("#m-w", root).onclick = e => { const b = e.target.closest("[data-j]"); if (b) { k = +b.dataset.j; draw(); } };
  $("#m-a", root).onchange = draw; draw(); });

sheet("Rare or common", head("03", "A rare word says more", "Click a word. How many of the 2,000 reviews contain it, and what weight does it get?") +
 `<div class="row" id="r-w"></div>
  <div class="box" style="margin-top:.8em"><div class="scroll"><table id="r-t"></table></div></div>
  <div class="row" style="margin-top:.7em"><label class="ck">times the word appears in a review (TF) <input type="range" id="r-tf" min="1" max="10" value="1"> <b id="r-tfv"></b></label></div>
  <p class="note" id="r-n"></p>`,
 root => {
  const W = D.words; let sel = "waste";
  $("#r-w", root).innerHTML = W.map(r => `<button class="chipbtn" data-w="${r[0]}">${r[0]}</button>`).join("");
  const draw = () => { const r = W.find(x => x[0] === sel), tf = +$("#r-tf", root).value, idf = r[2], one = Math.round(D.N / r[1]);
   $("#r-tfv", root).textContent = tf;
   $("#r-t", root).innerHTML = `<tr><th>Word</th><th>Reviews with it</th><th>Rarity</th><th>IDF weight</th><th>TF &times; IDF</th></tr><tr><td><b>${esc(r[0])}</b></td><td>${fmtN(r[1])} of ${fmtN(D.N)}</td><td>1 in ${one}</td><td>${f2(idf)}</td><td><b class="big" style="font-size:1.4em">${f2(tf * idf)}</b></td></tr>`;
   const s = W.find(x => x[0] === "story"), w = W.find(x => x[0] === "waste");
   $("#r-n", root).textContent = `Compare: "story" said twice = ${f2(2 * s[2])}. "waste" said once = ${f2(w[2])}. One rare word beats two common ones. "the" is in every review: weight 1, whatever the TF.`;
   $$("#r-w .chipbtn", root).forEach(b => b.classList.toggle("on", b.dataset.w === sel)); };
  $("#r-w", root).onclick = e => { const b = e.target.closest("[data-w]"); if (b) { sel = b.dataset.w; draw(); } };
  $("#r-tf", root).oninput = draw; draw(); });

sheet("Alert list", head("04", "Which reviews do I read first?", "Weight of the complaint words in each review: boring, waste, awful, worst, terrible, dull, stupid, mess.") +
 `<div class="row"><label class="ck"><input type="checkbox" id="a-l"> show the real label (positive or negative)</label></div>
  <div class="box" style="margin-top:.6em"><div class="scroll"><table id="a-t" style="font-size:.78em"></table></div></div><p class="note" id="a-n"></p>`,
 root => { const draw = () => { const on = $("#a-l", root).checked;
   $("#a-t", root).innerHTML = `<tr><th>Alert score</th><th>Review (start)</th><th>Words found (weight)</th>${on ? "<th>Label</th>" : ""}</tr>` + D.alert.rows.slice(0, 5).map(r => `<tr><td><b>${f2(r[1])}</b></td><td>${esc(r[2])}</td><td>${r[3].map(x => x[0] + " " + f2(x[1])).join(", ")}</td>${on ? `<td><span class="chip ${r[0] === "neg" ? "hi" : ""}">${r[0] === "neg" ? "negative" : "positive"}</span></td>` : ""}</tr>`).join("");
   $("#a-n", root).textContent = on ? `Top 20 reviews: ${D.alert.neg20} of 20 are negative. Overall only half are. A good first filter, not a verdict: a sarcastic positive review can use "waste" too.` : "Read the five. Would you escalate them? Then tick the box."; };
  $("#a-l", root).onchange = draw; draw(); });

sheet("Match a query", head("05", "Match a query to four reviews", "Choose the words of the query. The score says how much the important words overlap, from 0 to 1.") +
 `<div class="row" id="q-w"></div>
  <div class="box" style="margin-top:.7em"><div id="q-b"></div></div><p class="note" id="q-n"></p>`,
 root => { const on = new Set(["boring", "waste"]);
  $("#q-w", root).innerHTML = MV.map(w => `<button class="chipbtn" data-w="${w}">${w}</button>`).join("");
  const norm = v => Math.sqrt(sum(v.map(x => x * x))) || 1;
  const draw = () => { const q = MV.map((w, j) => on.has(w) ? MIDF[j] : 0), nq = norm(q);
   const sc = MW.map(r => on.size ? sum(r.map((x, j) => x * q[j])) / (norm(r) * nq) : 0);
   $("#q-b", root).innerHTML = MINI.map((t, i) => `<div class="brow" style="grid-template-columns:15em minmax(0,1fr) 3.4em"><span class="lab">R${i + 1} ${esc(t)}</span><div class="track"><div class="fill" style="width:${Math.max(sc[i] * 100, 0.5)}%"></div></div><span class="val">${f2(sc[i])}</span></div>`).join("");
   const best = sc.indexOf(Math.max(...sc));
   $("#q-n", root).textContent = !on.size ? "Choose at least one word." : sc[best] === 0 ? "No review shares a word with the query: every score is 0." : `Best: R${best + 1}. A review scores zero if it shares no word with the query. The score only sorts; it is not a percentage.`;
   $$("#q-w .chipbtn", root).forEach(b => b.classList.toggle("on", on.has(b.dataset.w))); };
  $("#q-w", root).onclick = e => { const b = e.target.closest("[data-w]"); if (b) { on.has(b.dataset.w) ? on.delete(b.dataset.w) : on.add(b.dataset.w); draw(); } }; draw(); });

sheet("Search the shop", head("06", "A search box for a marketplace", "Top 4 results for four customer queries.") +
 `<div class="row" id="s-t"></div>
  <div class="box" style="margin-top:.7em"><div class="scroll"><table id="s-r" style="font-size:.8em"></table></div></div>
  <p class="note" id="s-n" style="margin-top:.6em"></p><div class="box" style="margin-top:.5em"><div id="s-p"></div></div>`,
 root => {
  const NOTE = ["None of the four commuting bikes is in the top 4. The word \"commuting\" is in no listing (sellers wrote commute, commuter, bicycle). Only \"bike\" matches, and the bundle says it 10 times.",
   "Two good listings found. A sofa cover and a vintage 3-seater rank high because they say \"sofa\". The ones we want say couch, loveseat, settee.",

  const draw = () => { const s = D.shop[k];

   $("#s-p", root).innerHTML = Object.entries(s.present).map(([w, n]) => `<span class="chip ${n ? "" : "chg"}" style="margin-right:.5em">${esc(w)} in ${n} listing${n === 1 ? "" : "s"}</span>`).join("") + `<div class="mono" style="margin-top:.4em;font-size:.78em">Wanted: ${s.relTitles.map(esc).join(" · ")}</div>`;
   $("#s-n", root).textContent = NOTE[k]; $$("#s-t .tab", root).forEach(b => b.classList.toggle("on", +b.dataset.k === k)); };
  $("#s-t", root).onclick = e => { const b = e.target.closest("[data-k]"); if (b) { k = +b.dataset.k; draw(); } }; draw(); });

sheet("Same meaning", head("07", "Different words, same meaning", "Reviews that say \"very bad\" in four ways.") +
 `<div class="two"><div class="box"><span class="tag">Reviews containing the word</span><div id="y-b"></div></div>
  <div class="box"><span class="tag">Search \"awful\" and \"dreadful\"</span><div id="y-c"></div></div></div><p class="note" id="y-n"></p>`,
 root => { const r = D.syn.rows, m = Math.max(...r.map(x => x[1]));
  $("#y-b", root).innerHTML = bars(r.map(x => [x[0], x[1], `${x[1]} (${x[2]} neg)`]), m, "var(--w2)", "6em", "8.5em");
  const s = D.syn; $("#y-c", root).innerHTML = bars([["awful", s.awful], ["dreadful", s.dreadful], ["both", s.both]], s.awful, "var(--w1)", "6em");
  $("#y-n", root).textContent = `A search for "awful" finds ${s.awful} reviews and misses most of the ${s.dreadful} that say "dreadful": only ${s.both} contain both. Counting words cannot see that they mean the same. This is the vocabulary mismatch problem.`; });

sheet("Decide", head("08", "You run the shop: what do you change?", "Each fix has a price. The best ones combine the text with the normal columns.") +
 `<div class="box"><div class="scroll"><table style="font-size:.88em"><tr><th>Problem</th><th>Fix</th><th>Cost</th></tr>
 <tr><td>Bundle wins by repeating &ldquo;bike&rdquo;</td><td>Limit the effect of repeated words</td><td>Low: a setting</td></tr>
 <tr><td>Accessories shown before bikes</td><td>Use the category column; show Bikes first</td><td>Low: a rule</td></tr>
 <tr><td>Title says more than description</td><td>Give the title more weight</td><td>Low</td></tr>
 <tr><td>&ldquo;commuting&rdquo; &ne; &ldquo;commute&rdquo;</td><td>Reduce words to their root</td><td>Low: a library</td></tr>
 <tr><td>Couch / sofa, pram / stroller</td><td>Synonym list, or a method that compares meaning</td><td>Medium to high</td></tr>
 <tr><td>Sellers stuff keywords</td><td>Rules against it; check listings</td><td>Policy work</td></tr></table></div></div>
 <p class="note">Reading the top of an alert list, or the top of a search, is the job. The ranking is a tool to decide what to read, never the decision itself.</p>`,
 root => {});

/* ---------- shell ---------- */
const stage = $("#stage"), ticks = $("#ticks"); let cur = -1; const seen = new Set();
S.forEach((s, i) => { const el = document.createElement("section"); el.className = "sheet"; el.setAttribute("aria-label", s.title); el.innerHTML = s.html; stage.appendChild(el); s.el = el; ticks.insertAdjacentHTML("beforeend", `<i data-i="${i}" title="${esc(s.title)}"></i>`); });
$("#idxl").innerHTML = S.map((s, i) => `<li><button data-i="${i}"><span class="mono">${String(i + 1).padStart(2, "0")}</span>${esc(s.title)}</button></li>`).join("");
$("#tbn").textContent = " 01/" + S.length;
function go(i) { i = Math.max(0, Math.min(S.length - 1, i)); if (i === cur) return; if (cur >= 0) S[cur].el.classList.remove("on"); cur = i; const s = S[i]; s.el.classList.add("on"); s.el.scrollTop = 0; if (!s.done && s.init) { s.done = 1; s.init(s.el); } seen.add(i);
  $("#tbn").textContent = " " + String(i + 1).padStart(2, "0") + "/" + S.length; $("#tbt").textContent = s.title; $$("#ticks i").forEach((t, j) => { t.classList.toggle("on", j === i); t.classList.toggle("seen", seen.has(j) && j !== i); }); $("#idx").hidden = true;
  try { history.replaceState(null, "", "#s" + (i + 1)); } catch (e) {} }
S.forEach((s, i) => { s.init = s.init || null; }); 
$("#prev").onclick = () => go(cur - 1); $("#next").onclick = () => go(cur + 1); $("#bidx").onclick = () => { $("#idx").hidden = !$("#idx").hidden; };
$("#bth").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
$("#ticks").onclick = e => { const t = e.target.closest("i"); if (t) go(+t.dataset.i); }; $("#idxl").onclick = e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); };
addEventListener("keydown", e => { const tg = e.target; if (tg.tagName === "SELECT" || tg.tagName === "TEXTAREA" || (tg.tagName === "INPUT" && tg.type !== "checkbox")) return; const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); go(cur + 1); } else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); go(cur - 1); } else if (k === "Home") go(0); else if (k === "End") go(S.length - 1);
  else if (k === "f" || k === "F") { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (x) {} } else if (k === "g" || k === "G") $("#bidx").click(); });
const h = parseInt((location.hash.match(/^#s(\d+)$/) || [])[1]); go(h > 0 && h <= S.length ? h - 1 : 0);
</script>
